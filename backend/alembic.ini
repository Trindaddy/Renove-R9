# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# sys.path path, used to find modules; default is the current directory.
prepend_sys_path = .

# timezone to use when rendering the date within the migration file as
# well as the filename.
# string_value is passed to dateutil.tz.gettz() or pytz.timezone().
# timezone =

# max length of characters to clone to/use for the slug field in the
# migration file name
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow modules to be loaded that are
# not in the current path.
# allow_empty_history = false

# version location specification; This defaults to alembic/versions.
# When using multiple version directories, paths must be separated by ';'
# version_locations = %(here)s/alembic/versions

# version table name; default is alembic_version
# version_table = alembic_version

# version table schema; default is None
# version_table_schema = None

# set to 'true' to search for newer versions in the version table; default is 'false'
# check_schema = false

# logging configuration section
# logging_config = logging.ini

sqlalchemy.url = sqlite:///./r9_notebooks.db

[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts.  See the documentation for details.

# logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
